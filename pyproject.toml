[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minifield-training"
version = "0.1.0"
description = "Minifield Python/JAX training worker."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
numerical = ["jax==0.7.2"]
storage = ["safetensors==0.8.0"]
text = [
    "jinja2==3.1.6",
    "transformers==4.57.1",
]

[tool.uv]
required-version = "==0.11.30"

[dependency-groups]
dev = [
    "build==1.6.1",
    # The numerical optional dependency owns the jax version pin.
    "jax",
    "mypy==1.17.1",
    "numpy==2.2.6",
    "safetensors==0.8.0",
    "pylint==3.3.8",
    "pyink==25.12.0",
    "pytest==8.4.2",
    "ruff==0.12.12",
    "transformers==4.57.1",
    "jinja2==3.1.6",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
minifield_training = ["py.typed"]

[tool.pyink]
line-length = 80
pyink-indentation = 4
target-version = ["py312"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "D", "I", "UP", "SIM"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["typing", "collections.abc"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
files = ["src", "scripts", "tests"]
warn_unreachable = true
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
filterwarnings = ["error"]
markers = [
    "gpu: requires the qualified CUDA host and explicit numerical evidence",
]
